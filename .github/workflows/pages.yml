# Baut die Doku-Seite der megalib und veroeffentlicht sie auf GitHub Pages.
#
# Ergebnis: https://davidbecht.github.io/MegaKit/
#
# Ausloeser:
#   - Push auf main, wenn sich die Bibliothek, docs/ oder die Versionsdateien
#     geaendert haben
#   - Pull Request -> nur bauen, nicht veroeffentlichen
#   - Actions -> "Doku-Seite" -> Run workflow
#
# Veroeffentlicht wird ausschliesslich von main. Das Environment github-pages
# laesst Deployments nur vom Default-Branch zu; ein Lauf auf einem Tag wurde
# deshalb mit "not allowed to deploy to github-pages due to environment
# protection rules" abgewiesen. Ein Tag ist als Ausloeser auch nicht noetig:
# release.py pusht den Versions-Commit und den Tag gemeinsam, der Push auf
# main loest diesen Workflow aus, und "git describe" findet den Tag dann
# bereits vor. Deshalb stehen megasim/sim.py und megasound/megasound.py
# unten in der Pfadliste.
#
# Einmalig einzurichten: Settings -> Pages -> Source: "GitHub Actions".
#
# Die Beispielbilder liegen fertig im Repository (docs/bilder/). Sie werden
# unter Windows mit dem Simulator erzeugt:  python docs/build_docs.py --bilder

name: Doku-Seite

on:
  push:
    branches: [main]
    paths:
      - "megalib/megalib/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "megasim/sim.py"            # Versions-Commit von release.py
      - "megasound/megasound.py"    # dito
  pull_request:
    paths:
      - "megalib/megalib/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Zwei Laeufe gleichzeitig wuerden sich beim Veroeffentlichen in die Quere
# kommen. Der neuere gewinnt, der aeltere wird abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # fuer die Versionsangabe aus dem letzten Tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: avr-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr
      # Der juengste Tag vX.Y.Z. Nach einem Release ist das die eben
      # veroeffentlichte Version, sonst der Stand seit dem letzten Release.
      - name: Version bestimmen
        id: version
        run: |
          letzter=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "wert=${letzter:-Entwicklungsstand}" >> "$GITHUB_OUTPUT"
      # --pruefen uebersetzt jedes Beispiel der Seite mit avr-gcc fuer den
      # ATmega16. Schlaegt eines fehl, wird nichts veroeffentlicht.
      - name: Seite bauen und Beispiele uebersetzen
        run: python docs/build_docs.py --version "${{ steps.version.outputs.wert }}" --pruefen
      - name: Vollstaendigkeit melden
        run: |
          bilder=$(ls docs/bilder/*.png 2>/dev/null | wc -l)
          echo "### Doku-Seite gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "* Version: ${{ steps.version.outputs.wert }}" >> "$GITHUB_STEP_SUMMARY"
          echo "* Beispielbilder: $bilder" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  veroeffentlichen:
    # Nur von main. Jeder andere Ref wird vom Environment github-pages
    # ohnehin abgewiesen; so faellt der Lauf gar nicht erst rot aus.
    if: github.ref == 'refs/heads/main'
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
